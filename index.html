<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>대만여행 2026</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--p:#2563eb;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;padding-bottom:92px}
.hero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:18px;position:sticky;top:0;z-index:20}
.hero h1{margin:0 0 5px;font-size:20px}.hero p{margin:0;opacity:.85;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.stat{background:#ffffff1f;border:1px solid #ffffff26;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:14px}.stat span{font-size:10px;opacity:.8}
.nav{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#f6f7fbeb;position:sticky;top:105px;z-index:15;border-bottom:1px solid var(--line)}
.nav button{border:0;border-radius:999px;background:#fff;padding:9px 12px;font-weight:800;white-space:nowrap}.nav .active{background:var(--p);color:#fff}
.section{padding:12px}.card{background:#fff;border:1px solid #edf0f4;border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:0 8px 22px #0f172a10}
.card h2{font-size:17px;margin:0 0 10px}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;margin:0 4px 8px 0}
.timeline{border-left:3px solid #bfdbfe;padding-left:14px;margin-left:4px}.item{position:relative;padding:0 0 14px}.item:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#2563eb;left:-21px;top:5px;border:3px solid white}
.time{font-size:11px;color:#2563eb;font-weight:900}.title{font-weight:850;margin:3px 0}.desc{font-size:12px;color:#5b6472;line-height:1.55}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:10px;padding:9px 10px;font-size:11px;font-weight:850;background:#eff6ff;color:#1d4ed8;text-decoration:none}.dark{background:#0f172a;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{padding:10px;background:#f8fafc;border:1px solid #eef2f7;border-radius:12px}.kv small{display:block;color:#64748b;margin-bottom:3px}.kv strong{font-size:14px}
.listrow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px dashed #e5e7eb;font-size:12px}
.notice{font-size:11px;color:#64748b;line-height:1.45}.expense{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e5e7eb;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);z-index:30}.bottom .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.bottom button{background:none;border:0;font-size:10px;font-weight:800;color:#475569}.bottom span{display:block;font-size:18px}
.fab{position:fixed;right:18px;bottom:82px;z-index:45;border:0;border-radius:999px;padding:14px 17px;background:#111827;color:#fff;font-weight:900;box-shadow:0 10px 30px #0f172a3b}
.sheet{position:fixed;inset:0;background:#0f172a7a;z-index:60;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px}
.big{font-size:30px;font-weight:900;border:0;border-bottom:2px solid #dbeafe;padding:10px 2px;text-align:right;width:100%}
.chips{display:flex;gap:6px;overflow:auto;padding:5px 0}.chip{border:1px solid #dbe3ec;background:#fff;border-radius:999px;padding:8px 10px;white-space:nowrap;font-weight:800}.chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
input,select{border:1px solid #dbe1e8;border-radius:10px;padding:10px;font-size:13px}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}.actions button{padding:12px;border:0;border-radius:11px;font-weight:900}

.link-sections{display:grid;gap:10px;margin-top:12px}
.link-sector{background:#f8fafc;border:1px solid #e8edf3;border-radius:13px;padding:10px}
.link-sector h3{font-size:13px;margin:0 0 8px;color:#334155}
.link-sector .btnrow{margin-top:0}


.syncbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:11px;color:#64748b}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}.dot.ok{background:#16a34a}.dot.err{background:#dc2626}
.rowbtn{border:0;background:#eff6ff;color:#1d4ed8;border-radius:8px;padding:7px 8px;font-size:10px;font-weight:800}.danger{color:#dc2626;background:#fff1f2}


/* bottom navigation: 4 utility tabs */
.bottom-nav,.dock,.bottomnav{grid-template-columns:repeat(4,1fr)!important}


/* ===== Mobile app polish v2 ===== */
body{padding-bottom:96px}
.nav{
  display:grid!important;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:7px!important;
  overflow:visible!important;
  padding:12px 12px 11px!important;
  background:#f7f9fded!important;
}
.nav button{
  width:100%;
  min-width:0;
  padding:10px 4px!important;
  border:1px solid #e7ecf4!important;
  border-radius:16px!important;
  background:#fff!important;
  color:#111827!important;
  font-size:13px!important;
  font-weight:900!important;
  box-shadow:0 3px 10px #0f172a0a;
  transition:.18s ease;
}
.nav button.active{
  background:linear-gradient(135deg,#1d4ed8,#2563eb)!important;
  border-color:transparent!important;
  color:#fff!important;
  box-shadow:0 8px 18px #2563eb35!important;
  transform:translateY(-1px);
}

.section{padding:14px 12px 20px!important}
.card{
  border-radius:22px!important;
  padding:17px!important;
  box-shadow:0 10px 30px #0f172a12!important;
}
.card h2{font-size:19px!important;margin-bottom:13px!important}
.link-sections{gap:12px!important}
.link-sector{
  border-radius:18px!important;
  padding:14px!important;
  background:linear-gradient(180deg,#fbfdff,#f8fafc)!important;
}
.link-sector h3{font-size:14px!important;margin-bottom:10px!important}
.btn{
  border-radius:12px!important;
  padding:10px 12px!important;
  font-size:12px!important;
}
.notice{font-size:12px!important}

.bottom{
  position:fixed!important;
  left:10px!important;
  right:10px!important;
  bottom:8px!important;
  z-index:50!important;
  display:grid!important;
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
  gap:5px!important;
  padding:7px!important;
  padding-bottom:calc(7px + env(safe-area-inset-bottom))!important;
  background:rgba(255,255,255,.96)!important;
  border:1px solid rgba(226,232,240,.95)!important;
  border-radius:22px!important;
  box-shadow:0 14px 38px #0f172a2b!important;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.bottom button{
  min-width:0!important;
  min-height:60px!important;
  border:0!important;
  border-radius:16px!important;
  background:transparent!important;
  color:#64748b!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  gap:3px!important;
  padding:6px 2px!important;
  transition:transform .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease!important;
}
.bottom button .ico{
  display:block!important;
  font-size:24px!important;
  line-height:1!important;
  filter:saturate(.85);
}
.bottom button .label{
  display:block!important;
  font-size:11px!important;
  line-height:1.05!important;
  font-weight:900!important;
  letter-spacing:-.3px!important;
  white-space:nowrap!important;
}
.bottom button.active{
  background:linear-gradient(135deg,#1d4ed8,#2563eb)!important;
  color:#fff!important;
  box-shadow:0 8px 18px #2563eb42!important;
  transform:translateY(-3px)!important;
}
.bottom button.active .ico{
  transform:scale(1.08);
  filter:none;
}

.fab{
  right:18px!important;
  bottom:94px!important;
  padding:14px 18px!important;
  border-radius:18px!important;
  font-size:14px!important;
  box-shadow:0 12px 28px #0f172a33!important;
}
@media(max-width:370px){
  .bottom button .label{font-size:10px!important}
  .bottom button .ico{font-size:22px!important}
  .nav button{font-size:12px!important}
}


.train-modal-backdrop{
  position:fixed;inset:0;background:#0f172a66;z-index:120;
  display:none;align-items:flex-end;justify-content:center;
}
.train-modal-backdrop.show{display:flex}
.train-modal{
  width:min(100%,520px);background:#fff;border-radius:24px 24px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 40px #0f172a33;
}
.train-modal h3{margin:0 0 14px;font-size:20px}
.train-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.train-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#475569}
.train-form input,.train-form select,.train-form textarea{
  width:100%;box-sizing:border-box;border:1px solid #dbe3ee;border-radius:12px;
  padding:12px;font-size:16px;background:#fff;color:#111827;
}
.train-form textarea{min-height:84px;resize:vertical}
.train-form .full{grid-column:1/-1}
.train-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.train-modal-actions button{min-height:48px;border:0;border-radius:14px;font-size:15px;font-weight:900}
.train-modal-actions .cancel{background:#f1f5f9;color:#334155}
.train-modal-actions .save{background:#2563eb;color:#fff}


.time-picker-row{display:grid;grid-template-columns:1fr;gap:8px}
.ampm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ampm button{min-height:42px;border:1px solid #dbe3ee;border-radius:12px;background:#f8fafc;color:#64748b;font-size:14px;font-weight:900}
.ampm button.active{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 5px 14px #2563eb33}
.hm-selects{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.hm-selects select{min-height:46px;font-size:18px!important;font-weight:800;text-align:center}
.hm-colon{font-size:22px;font-weight:900;color:#475569}

</style>
</head>
<body>
<div class="app">
<header class="hero">
  <h1>🇹🇼 대만여행 2026</h1>
  <p id="meta">불러오는 중…</p>
  <div class="stats">
    <div class="stat"><b>40만원</b><span>1인 공동경비</span></div>
    <div class="stat"><b id="spentTop">0원</b><span>누적 사용</span></div>
    <div class="stat"><b id="remainTop">160만원</b><span>남은 공동경비</span></div>
  </div>
</header>

<div class="nav" id="nav"></div>
<main id="main"></main>

<button class="fab" onclick="openExpense()">＋ 경비</button>

<div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeExpense()">
 <div class="panel">
  <h2 style="margin:0 0 8px">🧾 빠른 경비 입력</h2>
  <div style="display:flex;gap:8px;align-items:end">
   <div style="flex:1"><small>금액</small><input id="amt" class="big" type="number" inputmode="decimal" placeholder="0"></div>
   <select id="cur"><option>TWD</option><option>KRW</option></select>
  </div>
  <small style="display:block;margin-top:10px">분류</small><div class="chips" id="cats"></div>
  <small style="display:block;margin-top:8px">결제수단</small><div class="chips" id="pays"></div>
  <input id="memo" style="width:100%;margin-top:8px" placeholder="메모(선택) 예: 우육면 4명">
  <div class="actions"><button onclick="closeExpense()">취소</button><button style="background:#0f172a;color:#fff" onclick="saveExpense()">저장</button></div>
 </div>
</div>

<div class="bottom">
<button id="u-check" onclick="show('check')"><span class="ico">🎒</span><span class="label">준비물</span></button>
<button id="u-train" onclick="show('train')"><span class="ico">🚆</span><span class="label">열차</span></button>
<button id="u-money" onclick="show('money')"><span class="ico">💰</span><span class="label">경비</span></button>
<button id="u-stay" onclick="show('stay')"><span class="ico">🏨</span><span class="label">숙소·렌탈</span></button>
</div>
</div>

<script>
let DATA=null,active='d1',cat='식비',pay='현금',SHARED={checklist:[],trains:[],expenses:[]},SHARED_LOADED=false,SHARED_LOADING=false,AUTO_REFRESH_TIMER=null,LAST_SHARED_SIG='';
const SHEETS_API_URL='https://script.google.com/macros/s/AKfycbz7r_9lHuw-whMyaSm2pm9lOO__SXbtcS3gWEwM4sipHiI1maRHW8MVxQJb0zD78v6T/exec';
const cats=['식비','야시장','교통','카페/간식','온천/입장','편의점','기타'];
const pays=['현금','총무카드','개인카드','모바일페이'];
const ready=()=>SHEETS_API_URL.startsWith('https://script.google.com/');

function sharedSignature(v){
  try{return JSON.stringify({
    checklist:(v.checklist||[]).map(x=>[x.row,x.item,x.owner,x.note]),
    trains:(v.trains||[]).map(x=>[x.row,x.date,x.route,x.departure,x.arrival,x.trainNo,x.status,x.note]),
    expenses:(v.expenses||[]).map(x=>[x.row,x.time,x.date,x.cat,x.cur,x.raw,x.pay,x.memo,x.rate,x.krw])
  })}catch(e){return ''}
}
function renderActiveSharedIfNeeded(){
  renderMoney();
  if(active==='check')renderCheck();
  else if(active==='train')renderTrain();
  else if(active==='money')renderMoneyPage();
}
async function backgroundRefresh(){
  if(!ready() || document.hidden || SHARED_LOADING) return;
  const before=LAST_SHARED_SIG || sharedSignature(SHARED);
  const ok=await loadShared(true);
  if(!ok) return;
  const after=sharedSignature(SHARED);
  if(after!==before){
    LAST_SHARED_SIG=after;
    renderActiveSharedIfNeeded();
  }
}
function startAutoRefresh(){
  if(AUTO_REFRESH_TIMER) clearInterval(AUTO_REFRESH_TIMER);
  AUTO_REFRESH_TIMER=setInterval(()=>{backgroundRefresh()},30000);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(AUTO_REFRESH_TIMER){clearInterval(AUTO_REFRESH_TIMER);AUTO_REFRESH_TIMER=null}
  }else{
    backgroundRefresh();
    startAutoRefresh();
  }
});

async function load(){
  try{
    DATA=await fetch('trip-data.json?v='+Date.now()).then(r=>{
      if(!r.ok) throw new Error('trip-data load failed');
      return r.json();
    });
    document.getElementById('meta').textContent=DATA.meta.dates+' · '+DATA.meta.people+'명';
    renderNav();
    renderChips();

    // First render immediately from local/static data so the app never stays blank.
    if(ready()){
      // Shared data starts empty so the UI never flashes static/local values before Sheet data arrives.
      SHARED.checklist=[];
      SHARED.trains=[];
      SHARED.expenses=[];
      setMoneyLoading();
    }else{
      SHARED.checklist=DATA.checklist||[];
      SHARED.trains=DATA.trains||[];
      SHARED.expenses=getLocal();
      SHARED_LOADED=true;
      renderMoney();
    }

    show('d1');

    // Load all shared data once at startup. Tab switches use in-memory data instantly.
    if(ready()){
      const ok=await loadShared();
      if(ok){
        LAST_SHARED_SIG=sharedSignature(SHARED);
        renderMoney();
        if(['check','train','money'].includes(active)) show(active);
        startAutoRefresh();
      }else{
        setMoneyUnavailable();
        if(['check','train','money'].includes(active)) show(active);
      }
    }
  }catch(err){
    document.getElementById('meta').textContent='일정 데이터를 불러오지 못했습니다';
    document.getElementById('main').innerHTML='<section class="section"><div class="card"><h2>데이터 로딩 오류</h2><p class="notice">trip-data.json 업로드 상태를 확인해주세요.</p></div></section>';
    console.error(err);
  }
}
function loadShared(force=false){
  if(SHARED_LOADED && !force) return Promise.resolve(true);
  if(SHARED_LOADING && !force) return new Promise(resolve=>{
    const wait=setInterval(()=>{
      if(!SHARED_LOADING){clearInterval(wait);resolve(SHARED_LOADED)}
    },80);
  });
  SHARED_LOADING=true;
  return new Promise(res=>{
    const cb='cb_'+Date.now(), s=document.createElement('script');
    let done=false;
    const finish=(ok)=>{
      if(done)return; done=true;
      SHARED_LOADING=false;
      try{delete window[cb]}catch(e){}
      try{s.remove()}catch(e){}
      res(ok);
    };
    const timer=setTimeout(()=>finish(false),5000);
    window[cb]=r=>{
      clearTimeout(timer);
      if(r&&r.ok){
        SHARED.checklist=r.checklist||[];
        SHARED.trains=r.trains||[];
        SHARED.expenses=r.expenses||[];
        SHARED_LOADED=true;
        finish(true);
      }else finish(false);
    };
    s.onerror=()=>{clearTimeout(timer);finish(false)};
    s.src=SHEETS_API_URL+'?action=all&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    document.head.appendChild(s);
  });
}
function postShared(o,after){if(!ready())return alert('Apps Script 주소 설정이 필요합니다.');let f=document.createElement('form'),i;f.method='POST';f.action=SHEETS_API_URL;f.target='gas_sink';f.style.display='none';Object.entries(o).forEach(([k,v])=>{i=document.createElement('input');i.name=k;i.value=v??'';f.appendChild(i)});document.body.appendChild(f);f.submit();f.remove();setTimeout(async()=>{
    SHARED_LOADED=false;
    const ok=await loadShared(true);
    if(ok)LAST_SHARED_SIG=sharedSignature(SHARED);
    renderMoney();
    after?after():show(active);
  },700)}
function renderNav(){
  document.getElementById('nav').innerHTML=
    DATA.days.map(d=>`<button id="n-${d.id}" onclick="show('${d.id}')">${d.date}</button>`).join('');
}
function show(id){active=id;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));
  let b=document.getElementById('n-'+id); if(b)b.classList.add('active');
  let u=document.getElementById('u-'+id); if(u)u.classList.add('active');
  let d=DATA.days.find(x=>x.id===id);if(d){document.getElementById('main').innerHTML=`<section class="section"><div class="card">${d.tags.map(t=>`<span class="badge">${t}</span>`).join('')}<h2>${d.date} · ${d.title}</h2><div class="timeline">${d.items.map(i=>`<div class="item"><div class="time">${i[0]}</div><div class="title">${i[1]}</div><div class="desc">${i[2]}</div></div>`).join('')}</div>${d.linkSections?`<div class="link-sections">${d.linkSections.map(s=>`<div class="link-sector"><h3>${s.title}</h3><div class="btnrow">${s.links.map(l=>`<a class="btn" target="_blank" href="${l[1]}">${l[0]}</a>`).join('')}</div></div>`).join('')}</div>`:''}</div></section>`;return}if(id==='check')renderCheck();if(id==='train')renderTrain();if(id==='money')renderMoneyPage();if(id==='stay')renderStay()}

function renderStay(){
  document.getElementById('main').innerHTML=`<section class="section"><div class="card">
    <h2>🏨 숙소 · 🚲 렌탈</h2>

    <div class="link-sections">
      <div class="link-sector">
        <h3>🏨 화롄 숙소 · 10/5~10/8</h3>
        <div class="notice" style="margin-bottom:8px">No. 13, Haibin Street, Hualien City, Taiwan 970</div>
        <div class="btnrow">
          <a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=No.+13,+Haibin+Street,+Hualien+City,+Taiwan+970">지도 열기</a>
        </div>
      </div>

      <div class="link-sector">
        <h3>🚲 화롄 자전거 렌탈샵</h3>
        <div class="notice" style="margin-bottom:8px">No. 127, Guolian 1st Rd., Guolian Vill., Hualien City, Hualien County 970</div>
        <div class="btnrow">
          <a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=No.+127,+Guolian+1st+Rd.,+Guolian+Vill.,+Hualien+City,+Hualien+County+970">지도 열기</a>
        </div>
      </div>

      <div class="link-sector">
        <h3>🏨 타이베이 숙소 · 10/8~10/9</h3>
        <div class="notice" style="margin-bottom:8px">No. 80, Huayin Street, 建明里, Taipei City 103</div>
        <div class="btnrow">
          <a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=No.+80,+Huayin+Street,+Taipei+City+103">지도 열기</a>
        </div>
      </div>
    </div>
  </div></section>`;
}

function getLocalChecklistState(){try{return JSON.parse(localStorage.getItem('tw_check_state_v1')||'{}')}catch(e){return{}}}
function setLocalChecklistState(key,done){let s=getLocalChecklistState();s[key]=!!done;localStorage.setItem('tw_check_state_v1',JSON.stringify(s))}
function checklistKey(x){return 'item:'+(x.item||'')+'|owner:'+(x.owner||'')}
function renderCheck(){
  if(ready() && !SHARED_LOADED){
    document.getElementById('main').innerHTML=`<section class="section"><div class="card">
      <h2>🎒 준비물</h2>
      <div class="syncbar"><span class="dot"></span>공용 준비물 목록을 불러오는 중...</div>
      <div class="listrow"><div></div><div><b>잠시만 기다려주세요</b><div class="notice">체크 상태는 각자 휴대폰에만 저장됩니다.</div></div><div></div></div>
    </div></section>`;
    return;
  }
  let a=SHARED.checklist||[],s=getLocalChecklistState();
  document.getElementById('main').innerHTML=`<section class="section"><div class="card">
    <h2>🎒 준비물</h2>
    <div class="syncbar"><span class="dot ${ready()?'ok':''}"></span>${ready()?'목록은 공용 · 체크는 내 기기에만 저장':'체크는 내 기기에만 저장'}</div>
    <div class="btnrow"><button class="btn dark" onclick="addChecklist()">＋ 준비물</button><button class="btn" onclick="refreshChecklist()">↻</button></div>
    ${a.map(x=>{let key=checklistKey(x),checked=!!s[key];return `<div class="listrow"><input type="checkbox" ${checked?'checked':''} onchange="toggleCheckLocal('${encodeURIComponent(key)}',this.checked)"><div><b>${esc(x.item)}</b><div class="notice">${esc(x.note||'')}</div></div><div style="text-align:right">${esc(x.owner||'')}${x.row?`<br><button class="rowbtn danger" onclick="delCheck(${x.row})">삭제</button>`:''}</div></div>`}).join('')}
  </div></section>`;
}
async function refreshChecklist(){
  if(!ready()){renderCheck();return;}
  SHARED_LOADED=false;
  renderCheck();
  await loadShared(true);
  LAST_SHARED_SIG=sharedSignature(SHARED);
  renderCheck();
}
function toggleCheckLocal(encodedKey,done){setLocalChecklistState(decodeURIComponent(encodedKey),done)}
function addChecklist(){let item=prompt('준비물');if(!item)return;postShared({action:'addChecklist',item,owner:prompt('담당','각자')||'',note:prompt('메모','')||''},renderCheck)}
function delCheck(row){if(confirm('이 준비물 항목을 공용 목록에서 삭제할까요?'))postShared({action:'deleteChecklist',row},renderCheck)}
function displayTrainTime(v){
  const s=String(v||'');
  const m=s.match(/(\d{1,2}):(\d{2})/);
  return m ? String(m[1]).padStart(2,'0')+':'+m[2] : s;
}
function renderTrain(){
  if(ready() && !SHARED_LOADED){
    document.getElementById('main').innerHTML=`<section class="section"><div class="card">
      <h2>🚆 열차시간</h2>
      <div class="syncbar"><span class="dot"></span>Google Sheet에서 열차 정보를 불러오는 중...</div>
    </div></section>`;
    return;
  }
  let a=SHARED.trains||[];
  document.getElementById('main').innerHTML=`<section class="section"><div class="card"><h2>🚆 열차시간</h2><div class="syncbar"><span class="dot ${ready()?'ok':''}"></span>${ready()?'Google Sheet 공동 저장':'연결 전'}</div>${a.map(x=>`<div class="listrow"><span>${esc(x.date)}</span><div><b>${esc(x.route)}</b><div class="notice">${esc(x.trainNo?'열차 '+x.trainNo+' · ':'')}${esc(x.status||'')}<br>${esc(x.note||'')}</div></div><div style="text-align:right"><strong>${esc(displayTrainTime(x.departure)||'미정')}</strong>${x.arrival?`<div class="notice">→ ${esc(displayTrainTime(x.arrival))}</div>`:''}${x.row?`<br><button class="rowbtn" onclick="editTrain(${x.row})">수정</button>`:''}</div></div>`).join('')}</div></section>`;
}
let TRAIN_EDIT_ROW=null;
let TRAIN_PERIOD={dep:'AM',arr:'AM'};
function parse24(v){
  const s=String(v||'').trim();
  const m=s.match(/(\d{1,2}):(\d{2})/);
  if(!m)return {period:'AM',hour:'12',minute:'00'};
  let h=parseInt(m[1],10), min=m[2], period=h>=12?'PM':'AM';
  let h12=h%12; if(h12===0)h12=12;
  return {period,hour:String(h12),minute:min};
}
function ensureTimeOptions(){
  ['depHour','arrHour'].forEach(id=>{
    const el=document.getElementById(id);
    if(el && !el.options.length){
      for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=String(i);o.textContent=String(i);el.appendChild(o)}
    }
  });
  ['depMinute','arrMinute'].forEach(id=>{
    const el=document.getElementById(id);
    if(el && !el.options.length){
      for(let i=0;i<60;i+=5){let v=String(i).padStart(2,'0'),o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)}
    }
  });
}
function setPeriod(which,period){
  TRAIN_PERIOD[which]=period;
  const am=document.getElementById(which+'AM'), pm=document.getElementById(which+'PM');
  if(am)am.classList.toggle('active',period==='AM');
  if(pm)pm.classList.toggle('active',period==='PM');
}
function applyTime(which,value){
  ensureTimeOptions();
  const t=parse24(value);
  setPeriod(which,t.period);
  document.getElementById(which+'Hour').value=t.hour;
  let m=parseInt(t.minute||'0',10);
  m=Math.max(0,Math.min(55,Math.round(m/5)*5));
  document.getElementById(which+'Minute').value=String(m).padStart(2,'0');
}
function to24(which){
  let h=parseInt(document.getElementById(which+'Hour').value||'12',10);
  const m=document.getElementById(which+'Minute').value||'00';
  const period=TRAIN_PERIOD[which]||'AM';
  if(period==='AM' && h===12)h=0;
  if(period==='PM' && h!==12)h+=12;
  return String(h).padStart(2,'0')+':'+m;
}
function editTrain(row){
  const x=SHARED.trains.find(v=>v.row===row); if(!x)return;
  TRAIN_EDIT_ROW=row;
  ensureTimeOptions();
  applyTime('dep',x.departure);
  applyTime('arr',x.arrival);
  document.getElementById('trTrainNo').value=x.trainNo||'';
  const statusEl=document.getElementById('trStatus');
  statusEl.value=x.status||'예약 필요';
  if(!statusEl.value)statusEl.value='예약 필요';
  document.getElementById('trNote').value=x.note||'';
  document.getElementById('trainModal').classList.add('show');
}
function closeTrainModal(){
  document.getElementById('trainModal').classList.remove('show');
  TRAIN_EDIT_ROW=null;
}
function saveTrainEdit(){
  if(!TRAIN_EDIT_ROW)return;
  const departure=to24('dep');
  const arrival=to24('arr');
  const trainNo=document.getElementById('trTrainNo').value.trim();
  const status=document.getElementById('trStatus').value;
  const note=document.getElementById('trNote').value.trim();
  const row=TRAIN_EDIT_ROW;
  closeTrainModal();
  postShared({action:'updateTrain',row,departure,arrival,trainNo,status,note},renderTrain);
}
function getLocal(){try{return JSON.parse(localStorage.getItem('tw_expenses_v3')||'[]')}catch(e){return[]}}
function setMoneyLoading(){
  const spent=document.getElementById('spentTop'), remain=document.getElementById('remainTop');
  if(spent) spent.textContent='불러오는 중';
  if(remain) remain.textContent='불러오는 중';
}
function setMoneyUnavailable(){
  const spent=document.getElementById('spentTop'), remain=document.getElementById('remainTop');
  if(spent) spent.textContent='연결 확인';
  if(remain) remain.textContent='연결 확인';
}
function renderMoney(){let a=SHARED.expenses||[],budget=DATA?DATA.meta.budgetKRW:1600000,total=Math.round(a.reduce((s,x)=>s+(Number(x.krw)||0),0));document.getElementById('spentTop').textContent=total.toLocaleString()+'원';document.getElementById('remainTop').textContent=Math.max(0,budget-total).toLocaleString()+'원';if(active==='money')renderMoneyPage()}
function renderMoneyPage(){
  if(ready() && !SHARED_LOADED){
    document.getElementById('main').innerHTML=`<section class="section"><div class="card">
      <h2>💰 공동경비</h2>
      <div class="syncbar"><span class="dot"></span>Google Sheet에서 경비를 불러오는 중...</div>
      <div class="grid2">
        <div class="kv"><small>누적 사용</small><strong>—</strong></div>
        <div class="kv"><small>남은 경비</small><strong>—</strong></div>
      </div>
    </div></section>`;
    return;
  }
  let a=SHARED.expenses||[],budget=DATA.meta.budgetKRW,total=Math.round(a.reduce((s,x)=>s+(Number(x.krw)||0),0));
  document.getElementById('main').innerHTML=`<section class="section"><div class="card"><h2>💰 공동경비</h2><div class="syncbar"><span class="dot ${ready()?'ok':''}"></span>${ready()?'Google Sheet 공동 저장':'이 기기 임시 저장'}</div><div class="grid2"><div class="kv"><small>누적 사용</small><strong>${total.toLocaleString()}원</strong></div><div class="kv"><small>남은 경비</small><strong>${Math.max(0,budget-total).toLocaleString()}원</strong></div></div><div class="btnrow"><button class="btn dark" onclick="openExpense()">＋ 경비 입력</button><button class="btn" onclick="refreshMoney()">↻</button><button class="btn" onclick="exportCsv()">CSV</button></div>${a.map(x=>`<div class="expense"><div><b>${esc(x.cat)}</b> · ${x.cur==='TWD'?'NT$':''}${Number(x.raw).toLocaleString()}${x.cur==='KRW'?'원':''}<div class="notice">${esc(x.pay||'')}${x.memo?' · '+esc(x.memo):''} · ${esc(x.time||x.local||'')}</div></div>${x.row?`<button onclick="delE(${x.row})" style="border:0;background:none;color:#dc2626">삭제</button>`:''}</div>`).join('')||'<p class="notice">아직 경비가 없습니다.</p>'}</div></section>`;
}
async function refreshMoney(){
  if(!ready()){renderMoney();renderMoneyPage();return;}
  SHARED_LOADED=false;
  renderMoneyPage();
  const ok=await loadShared();
  if(ok){LAST_SHARED_SIG=sharedSignature(SHARED);renderMoney();renderMoneyPage();}
  else{setMoneyUnavailable();renderMoneyPage();}
}
function renderChips(){document.getElementById('cats').innerHTML=cats.map((x,i)=>`<button class="chip ${i===0?'active':''}" onclick="pick('cat',this,'${x}')">${x}</button>`).join('');document.getElementById('pays').innerHTML=pays.map((x,i)=>`<button class="chip ${i===0?'active':''}" onclick="pick('pay',this,'${x}')">${x}</button>`).join('')}
function pick(t,b,v){b.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');t==='cat'?cat=v:pay=v}
function openExpense(){document.getElementById('sheet').classList.add('show');setTimeout(()=>document.getElementById('amt').focus(),100)}function closeExpense(){document.getElementById('sheet').classList.remove('show')}
function saveExpense(){let raw=parseFloat(document.getElementById('amt').value||0);if(!raw)return;let cur=document.getElementById('cur').value,rate=DATA.meta.exchangeRateKRWPerTWD,memo=document.getElementById('memo').value.trim();if(ready())postShared({action:'addExpense',amount:raw,cur,rate,cat,pay,memo,date:new Date().toLocaleDateString('sv-SE'),inputter:''},()=>{document.getElementById('amt').value='';document.getElementById('memo').value='';closeExpense();renderMoneyPage()});else{let a=getLocal(),krw=cur==='KRW'?raw:raw*rate;a.unshift({raw,cur,krw,cat,pay,memo,local:new Date().toLocaleString('ko-KR')});localStorage.setItem('tw_expenses_v3',JSON.stringify(a));SHARED.expenses=a;renderMoney();closeExpense()}}
function delE(row){if(confirm('이 경비를 삭제할까요?'))postShared({action:'deleteExpense',row},()=>{renderMoney();renderMoneyPage()})}
function exportCsv(){let a=SHARED.expenses||[];if(!a.length)return alert('경비 내역이 없습니다.');let rows=[['시간','분류','결제수단','금액','통화','KRW환산','메모'],...a.slice().reverse().map(x=>[x.time||x.local,x.cat,x.pay,x.raw,x.cur,Math.round(x.krw),x.memo])],csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(blob),aa=document.createElement('a');aa.href=u;aa.download='대만여행_공동경비.csv';aa.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
load();
</script>
<iframe name="gas_sink" id="gas_sink" style="display:none"></iframe>

        <div class="time-picker-row">
          <div class="ampm">
            <button type="button" id="depAM" onclick="setPeriod('dep','AM')">오전</button>

          <div class="ampm">
            <button type="button" id="arrAM" onclick="setPeriod('arr','AM')">오전</button>
